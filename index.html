<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>호재맵 — 부동산 호재 지도</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root {
  --bg:#fff; --bg2:#f5f6f9; --bg3:#eef0f4;
  --border:rgba(0,0,0,0.07); --border2:rgba(0,0,0,0.12);
  --text:#111214; --text2:#5a5f6e; --text3:#9298a8;
  --radius:12px; --radius-sm:8px; --shadow:0 4px 24px rgba(0,0,0,0.11);
}
html,body { height:100%; font-family:'Noto Sans KR',sans-serif; overflow:hidden; }
#app { display:flex; height:100vh; }
#map-area { flex:1; position:relative; }
#map { width:100%; height:100%; }

/* 호버 툴팁 */
#htip {
  position:absolute; pointer-events:none; z-index:2000;
  background:rgba(10,11,15,0.88); color:white;
  border-radius:10px; padding:7px 12px;
  font-size:12px; font-weight:600; white-space:nowrap;
  display:none; line-height:1.6;
  box-shadow:0 4px 16px rgba(0,0,0,0.3);
}
#htip .tip-path  { font-size:10px; font-weight:400; opacity:0.6; }
#htip .tip-grade { font-size:10px; font-weight:500; opacity:0.75; margin-top:1px; }
#htip .tip-inh   { font-size:10px; font-weight:400; opacity:0.6; font-style:italic; }

#top-bar {
  position:absolute; top:16px; left:50%; transform:translateX(-50%);
  background:var(--bg); border-radius:24px; padding:9px 20px;
  box-shadow:var(--shadow); display:flex; align-items:center; gap:10px;
  z-index:1000; white-space:nowrap; pointer-events:none;
}
#top-bar .dot { width:8px; height:8px; border-radius:50%; background:#003fa5; }
#top-bar .logo { font-size:14px; font-weight:700; letter-spacing:-0.3px; }
#top-bar .sub  { font-size:11px; color:var(--text3); }

/* 좌상단 레벨 표시 — 3단계 */
#level-badge {
  position:absolute; top:16px; left:16px;
  background:var(--bg); border-radius:20px; padding:5px 8px;
  box-shadow:var(--shadow); z-index:1000;
  display:flex; align-items:center; gap:2px;
}
.lv {
  font-size:11px; font-weight:600; color:var(--text3);
  padding:3px 9px; border-radius:14px; transition:all 0.18s;
}
.lv.on { background:#dce8f8; color:#1565c0; }
.lv-sep { font-size:9px; color:var(--border2); }

#zoom-hint {
  position:absolute; bottom:28px; left:50%; transform:translateX(-50%);
  background:rgba(15,16,20,0.70); color:white; border-radius:20px;
  padding:6px 14px; font-size:11px; z-index:1000; pointer-events:none;
  white-space:nowrap; transition:opacity 0.5s;
}
#loading {
  position:absolute; inset:0; background:#f5f6f9;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  z-index:2000; gap:14px;
}
.spinner { width:36px; height:36px; border:3px solid var(--bg3); border-top-color:#1565c0; border-radius:50%; animation:spin 0.8s linear infinite; }
#loading p { font-size:13px; color:var(--text3); }
@keyframes spin { to { transform:rotate(360deg); } }

/* 동 데이터 지연 로딩 표시 */
#dong-loading {
  display:none; position:absolute; top:60px; left:50%; transform:translateX(-50%);
  background:rgba(15,16,20,0.78); color:white; border-radius:20px;
  padding:6px 15px; font-size:11px; z-index:1500;
  align-items:center; gap:8px;
}
#dong-loading .spinner { width:12px; height:12px; border-width:2px; border-color:rgba(255,255,255,0.25); border-top-color:#fff; }
#err {
  display:none; position:absolute; top:70px; left:50%; transform:translateX(-50%);
  background:#fff3cd; border:1px solid #ffc107; border-radius:var(--radius-sm);
  padding:10px 16px; font-size:12px; color:#856404; z-index:1000;
  max-width:420px; text-align:center; line-height:1.7;
}

/* 사이드바 접기 — 지도를 넓게 보고 싶을 때 */
#sb-toggle {
  position:absolute; top:50%; right:0; transform:translateY(-50%);
  width:20px; height:52px; border:1px solid var(--border2); border-right:none;
  border-radius:8px 0 0 8px; background:var(--bg); color:var(--text3);
  font-size:14px; line-height:1; cursor:pointer; z-index:1100;
  box-shadow:-2px 0 8px rgba(0,0,0,0.07); font-family:inherit;
  display:flex; align-items:center; justify-content:center; padding:0;
  transition:color 0.15s;
}
#sb-toggle:hover { color:var(--text); }
#app.sb-hidden #sidebar { width:0; min-width:0; border-left:none; overflow:hidden; }
#app.sb-hidden #sb-toggle { transform:translateY(-50%) rotate(180deg); }

/* 사이드바 */
#sidebar {
  width:292px; height:100vh; overflow-y:auto;
  flex-shrink:0; transition:width 0.24s ease;
  background:var(--bg); border-left:1px solid var(--border);
  display:flex; flex-direction:column;
  box-shadow:-2px 0 14px rgba(0,0,0,0.07);
}
#sb-brand { padding:18px 18px 14px; border-bottom:1px solid var(--border); }
#sb-brand h1 { font-size:15px; font-weight:700; letter-spacing:-0.4px; }
#sb-brand p  { font-size:11px; color:var(--text3); margin-top:3px; }
#legend { padding:10px 18px 9px; border-bottom:1px solid var(--border); }
.sec-label { font-size:10px; font-weight:600; color:var(--text3); text-transform:uppercase; letter-spacing:0.6px; margin-bottom:8px; }
.leg-steps { display:flex; gap:2px; margin-bottom:5px; border-radius:4px; overflow:hidden; }
.leg-step { flex:1; height:9px; }
.leg-lbls { display:flex; justify-content:space-between; font-size:9px; color:var(--text3); }
#filters { padding:9px 18px 11px; border-bottom:1px solid var(--border); }
.chips { display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
.chip {
  padding:4px 10px; border-radius:20px; font-size:11px; font-weight:500;
  cursor:pointer; border:1px solid var(--border2); color:var(--text2);
  background:transparent; transition:all 0.15s; user-select:none;
}
.chip:hover { background:var(--bg3); }
.chip.on { background:#dce8f8; color:#1565c0; border-color:#90baea; }
#detail { flex:1; padding:14px 18px; }
.ph { text-align:center; color:var(--text3); font-size:12px; padding-top:55px; line-height:2.2; }
.ph-icon { font-size:28px; }
.r-name { font-size:18px; font-weight:700; letter-spacing:-0.5px; margin-bottom:3px; }
.r-path { font-size:10px; color:var(--text3); margin-bottom:2px; }
.r-sub  { font-size:11px; color:var(--text3); margin-bottom:13px; }

/* 카드 머리 — 이름이 주인공, 점수는 배지로 물러남 */
.card-head {
  display:flex; justify-content:space-between; align-items:flex-start;
  gap:10px; margin-bottom:14px;
}
.score-badge {
  flex-shrink:0; font-size:15px; font-weight:700; letter-spacing:-0.5px;
  border-radius:20px; padding:5px 13px; line-height:1.3; cursor:help;
}

/* 이야기 */
.beats { display:flex; flex-direction:column; gap:2px; margin-bottom:14px; }
.beat {
  display:flex; gap:10px; padding:11px 12px;
  border-radius:10px; background:var(--bg2);
}
.beat.minus { background:#fdf4f2; }
.beat-ico { font-size:16px; line-height:1.35; flex-shrink:0; }
.beat-head {
  font-size:13px; font-weight:600; color:var(--text);
  line-height:1.5; letter-spacing:-0.3px;
}
.beat.minus .beat-head { color:#8a3a24; }
.beat-detail { font-size:11px; color:var(--text2); line-height:1.6; margin-top:4px; }
.beat-top {
  display:inline-block; font-size:10px; font-weight:700; color:#1565c0;
  background:#dce8f8; border-radius:5px; padding:2px 7px; margin-top:6px;
}
.tags { line-height:1.9; margin-bottom:14px; }
.tag {
  display:inline-block; background:rgba(0,0,0,0.06); border-radius:20px;
  padding:3px 9px; font-size:10px; font-weight:600; margin:0 2px 2px 0;
  color:var(--text2);
}

/* 점수 분해 — 왜 이 점수인지 */
.why { background:var(--bg2); border-radius:10px; padding:11px 12px; margin-bottom:14px; }
.why-hd { font-size:10px; font-weight:700; color:var(--text3); margin-bottom:8px; }
.wf { display:flex; height:14px; border-radius:4px; overflow:hidden; gap:1px; }
.wf-seg { min-width:2px; cursor:help; transition:opacity 0.15s; }
.wf-seg:hover { opacity:0.75; }
.why-legend { display:flex; flex-wrap:wrap; gap:4px 10px; margin-top:8px; }
.wl { display:flex; align-items:center; gap:4px; font-size:10px; color:var(--text2); }
.wl i { width:7px; height:7px; border-radius:2px; flex-shrink:0; }
.why-line { font-size:11px; color:var(--text2); line-height:1.65; margin-top:8px; }
.why-line b { color:var(--text); font-weight:600; }
.wpct { font-size:9px; color:var(--text3); }

/* 숫자는 접어둔다 */
.numbers { margin-top:16px; border-top:1px solid var(--border); padding-top:12px; }
.numbers summary {
  font-size:11px; font-weight:600; color:var(--text3);
  cursor:pointer; user-select:none; list-style:none; padding:2px 0;
}
.numbers summary::-webkit-details-marker { display:none; }
.numbers summary::before { content:"▸ "; }
.numbers[open] summary::before { content:"▾ "; }
.numbers summary:hover { color:var(--text2); }
.inh-note {
  background:var(--bg3); border-radius:6px; padding:7px 10px;
  font-size:10px; color:var(--text2); line-height:1.6; margin-bottom:12px;
}
.score-card {
  display:flex; justify-content:space-between; align-items:center;
  border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:14px;
}
.sc-num  { font-size:28px; font-weight:700; letter-spacing:-1px; line-height:1; }
.sc-unit { font-size:13px; font-weight:400; }
.sc-lbl  { font-size:10px; margin-top:3px; opacity:0.6; }
.sc-grade { font-size:13px; font-weight:700; }
.cats { margin-bottom:14px; }
.cat-row { display:flex; justify-content:space-between; font-size:11px; color:var(--text2); margin-bottom:3px; }
.cat-val { font-weight:600; }
.bar-bg  { height:4px; border-radius:2px; background:var(--bg3); margin-bottom:8px; overflow:hidden; }
.bar-fill { height:100%; border-radius:2px; }
.news-hd { font-size:10px; font-weight:600; color:var(--text3); text-transform:uppercase; letter-spacing:0.6px; margin-bottom:9px; }
.news-item { padding:8px 0; border-bottom:1px solid var(--border); }
.news-item:last-child { border-bottom:none; }
.ntag { display:inline-block; font-size:10px; font-weight:700; padding:2px 6px; border-radius:4px; margin-bottom:3px; }
.t-transport { background:#dce8f8; color:#1565c0; }
.t-develop   { background:#e0f0d0; color:#2e6b0e; }
.t-policy    { background:#faecd6; color:#7a4800; }
.t-supply    { background:#fbe8e8; color:#9e2a2a; }
.t-job       { background:#f3e5f5; color:#6a1b9a; }
.t-school    { background:#e0f7fa; color:#00838f; }
.t-life      { background:#e8f5e9; color:#2e7d32; }
.t-population{ background:#fff3e0; color:#e65100; }
.t-future    { background:#e3eaf8; color:#003fa5; }
.ntext { font-size:12px; color:var(--text); line-height:1.55; }
.ndate { font-size:10px; color:var(--text3); margin-top:2px; }
.ndate a { color:var(--text2); }

/* 실측 정보 — 좌표로 계산된 값 */
.measured {
  display:inline-block; font-size:8px; font-weight:700; vertical-align:middle;
  background:#e8f5e9; color:#2e7d32; border-radius:3px; padding:1px 4px; margin-left:3px;
}
.mx-grid { margin-bottom:8px; }
.mx-item {
  display:flex; justify-content:space-between; align-items:baseline;
  font-size:11px; color:var(--text2); padding:5px 0;
  border-bottom:1px solid var(--border);
}
.mx-item:last-child { border-bottom:none; }
.mx-item b { color:var(--text); font-weight:600; }
.mx-item small { color:var(--text3); font-weight:400; }
.mx-note {
  background:var(--bg3); border-radius:6px; padding:7px 10px;
  font-size:9px; color:var(--text2); line-height:1.65; margin-bottom:14px;
}
.ai-btn {
  display:block; width:100%; margin-top:14px; padding:11px;
  background:var(--text); color:white; border:none; border-radius:var(--radius-sm);
  font-size:12px; font-weight:600; cursor:pointer; font-family:inherit;
  letter-spacing:-0.2px; transition:opacity 0.15s;
}
.ai-btn:hover { opacity:0.78; }
.ver { opacity:0.5; font-size:8px; }
.disclaimer { font-size:9px; color:var(--text3); line-height:1.7; margin-top:12px; text-align:center; }
#sidebar::-webkit-scrollbar { width:3px; }
#sidebar::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }
.leaflet-container { font-family:'Noto Sans KR',sans-serif !important; }
/* 안개가 걷히는 연출 */
.leaflet-interactive { transition:fill 0.45s ease, fill-opacity 0.45s ease, stroke 0.45s ease; }

/* ── 검색 ── */
#search-box { padding:10px 18px 12px; border-bottom:1px solid var(--border); position:relative; }
.search-row {
  display:flex; align-items:center; gap:7px;
  background:var(--bg2); border:1px solid var(--border2);
  border-radius:20px; padding:0 12px; transition:border-color 0.15s;
}
.search-row:focus-within { border-color:#90baea; background:var(--bg); }
.search-ico { font-size:12px; opacity:0.5; flex-shrink:0; }
#search {
  flex:1; border:none; background:none; outline:none;
  font-family:inherit; font-size:13px; color:var(--text);
  padding:9px 0; min-width:0;
}
#search::placeholder { color:var(--text3); font-size:12px; }
#search::-webkit-search-cancel-button { display:none; }
#search-x {
  border:none; background:none; cursor:pointer; color:var(--text3);
  font-size:17px; line-height:1; padding:2px 0 4px; display:none; flex-shrink:0;
}
#search-x.on { display:block; }
#search-results { margin-top:7px; max-height:38vh; overflow-y:auto; }
.sr {
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  padding:8px 10px; border-radius:7px; cursor:pointer; font-size:12px;
}
.sr:hover, .sr.sel { background:var(--bg3); }
.sr-name { font-weight:600; color:var(--text); }
.sr-path { font-size:10px; color:var(--text3); margin-top:1px; }
.sr-lv {
  font-size:9px; font-weight:600; color:var(--text3);
  background:var(--bg3); border-radius:4px; padding:2px 5px; flex-shrink:0;
}
.sr:hover .sr-lv, .sr.sel .sr-lv { background:var(--bg); }
.sr-score { font-size:12px; font-weight:700; flex-shrink:0; }
.sr-none { font-size:11px; color:var(--text3); padding:8px 10px; }

.fav-hd { font-size:10px; font-weight:600; color:var(--text3); margin-bottom:5px; }
.fav-item {
  display:flex; justify-content:space-between; align-items:center;
  font-size:11px; color:var(--text2); padding:5px 8px; margin-bottom:3px;
  background:var(--bg2); border-radius:6px; cursor:pointer;
}
.fav-item:hover { background:var(--bg3); }
.fav-item b { color:var(--text); font-weight:600; }
.fav-x { color:var(--text3); font-size:13px; padding:0 2px; }

#favs:not(:empty) { padding:11px 18px; border-bottom:1px solid var(--border); }

/* 새로 연 동네 알림 */
.discover {
  background:linear-gradient(135deg,#e8f2ff,#dce8f8); border-radius:8px;
  padding:9px 12px; margin-bottom:12px; font-size:11px; font-weight:600;
  color:#0d47a1; animation:pop 0.45s ease;
}
@keyframes pop { from { transform:scale(0.94); opacity:0; } to { transform:scale(1); opacity:1; } }
.fav-btn {
  background:none; border:1px solid var(--border2); border-radius:20px;
  font-size:11px; font-family:inherit; color:var(--text2);
  padding:4px 11px; cursor:pointer; transition:all 0.15s;
}
.fav-btn.on { background:#fff4d6; border-color:#f0c860; color:#8a6100; }

/* 모바일 바텀시트 — 좁은 화면에서만 */
#sheet-handle { display:none; }
@media (max-width:720px) {
  #app { display:block; }
  /* 지도는 화면 전체를 채우고 시트가 그 위에 얹힌다.
     지도를 시트 위쪽에만 두면 시트를 내렸을 때 빈 공간만 생긴다. */
  #map-area { position:absolute; inset:0; }
  #sidebar {
    position:fixed; left:0; right:0; bottom:0; width:auto;
    height:42vh; max-height:88vh; border-left:none;
    border-top-left-radius:18px; border-top-right-radius:18px;
    box-shadow:0 -4px 24px rgba(0,0,0,0.16); z-index:1200;
    transition:height 0.28s cubic-bezier(.32,.72,0,1);
  }
  /* 시트에 가린 만큼 지도 컨트롤을 위로 올린다 */
  .leaflet-bottom { bottom:44vh; transition:bottom 0.28s; }
  #sidebar.closed ~ * .leaflet-bottom, .sheet-closed .leaflet-bottom { bottom:96px; }
  .sheet-open .leaflet-bottom { bottom:84vh; }
  #sidebar.open   { height:82vh; }
  #sidebar.closed { height:88px; }
  #sheet-handle {
    display:block; padding:8px 18px 6px; cursor:grab;
    border-bottom:1px solid var(--border); flex-shrink:0;
    position:sticky; top:0; background:var(--bg); z-index:2;
    border-top-left-radius:18px; border-top-right-radius:18px;
  }
  .grip { width:36px; height:4px; border-radius:2px; background:var(--border2); margin:0 auto 6px; }
  #sheet-peek { font-size:11px; color:var(--text3); text-align:center; height:15px; }
  #sb-brand { padding:12px 18px 10px; }
  #top-bar { display:none; }
  #sb-toggle { display:none; }
  #zoom-hint { bottom:auto; top:60px; }
  #detail { padding-bottom:40px; }
  .beat { padding:12px 13px; }
  .beat-head { font-size:14px; }
}
</style>
</head>
<body>
<div id="app">
  <div id="map-area">
    <div id="map"></div>
    <div id="loading"><div class="spinner"></div><p>지도 데이터를 불러오는 중...</p></div>
    <div id="dong-loading"><div class="spinner"></div><span>동 단위 경계 불러오는 중...</span></div>
    <div id="err"></div>
    <div id="htip">
      <span id="htip-name"></span>
      <div class="tip-path"  id="htip-path"></div>
      <div id="htip-score"></div>
      <div class="tip-grade" id="htip-grade"></div>
      <div class="tip-inh"   id="htip-inh"></div>
    </div>
    <div id="top-bar"><div class="dot"></div><span class="logo">호재맵</span><span class="sub">전국 부동산 호재 지도</span></div>
    <div id="level-badge">
      <span class="lv on" data-lv="sido">시도</span><span class="lv-sep">›</span>
      <span class="lv"    data-lv="sgg">시군구</span><span class="lv-sep">›</span>
      <span class="lv"    data-lv="dong">동</span>
    </div>
    <div id="zoom-hint">🔍 확대할수록 더 좁은 동네까지 볼 수 있어요</div>
    <button id="sb-toggle" title="사이드바 접기/펼치기" aria-label="사이드바 접기">›</button>
  </div>
  <div id="sidebar">
    <div id="sheet-handle"><div class="grip"></div><div id="sheet-peek"></div></div>
    <div id="sb-brand"><h1>여기 왜 뜨는 걸까?</h1><p>동네를 눌러보면 이유를 알려드려요</p></div>

    <div id="search-box">
      <div class="search-row">
        <span class="search-ico">🔍</span>
        <input id="search" type="search" placeholder="동네 이름으로 찾기 — 예: 대치동"
               autocomplete="off" enterkeyhint="search">
        <button id="search-x" type="button" aria-label="지우기">×</button>
      </div>
      <div id="search-results"></div>
    </div>

    <div id="favs"></div>
    </div>
    <div id="legend">
      <div class="sec-label">호재 지수 (7단계)</div>
      <div class="leg-steps">
        <div class="leg-step" style="background:#6d0000"></div>
        <div class="leg-step" style="background:#c62828"></div>
        <div class="leg-step" style="background:#e65100"></div>
        <div class="leg-step" style="background:#f9a825"></div>
        <div class="leg-step" style="background:#2e7d32"></div>

};

// ── 종합점수 계산 ────────────────────────────────────────────
// 점수는 9개 지표의 가중평균이다. 손으로 정한 숫자가 아니라 계산 결과라서
// 카드에서 "왜 이 점수인지"를 그대로 보여줄 수 있다.
// 가중치 합은 1.0. 집값을 실제로 움직이는 힘 순서로 잡았다.
const WEIGHTS = {
  transport:0.14, develop:0.14, job:0.14, future:0.13,
  policy:0.11, school:0.11, life:0.09,
  supply:0.07, population:0.07,
};
function baseScore(reg) {
  let v = 0;
  for (const k in WEIGHTS) v += (reg[k] != null ? reg[k] : 50) * WEIGHTS[k];
  return v;
}
// 지표별 기여도 — 합치면 종합점수가 된다
function contributions(reg) {
  return Object.keys(WEIGHTS)
    .map(k => ({ k, v:reg[k] != null ? reg[k] : 50, w:WEIGHTS[k],
                 c:(reg[k] != null ? reg[k] : 50) * WEIGHTS[k] }))
    .sort((a, b) => b.c - a.c);
}

let curFilter = "all";
function getScore(reg) { return curFilter === "all" ? reg.score : (reg[curFilter] != null ? reg[curFilter] : reg.score); }

// ── 코드 계층 조회 ───────────────────────────────────────────
// 코드 길이: 시도 2 · 시군구 5 · 행정동 7
// 해당 코드에 데이터가 없으면 상위 단계 값을 상속합니다.
function lookup(code) {
  code = String(code);
  if (DATA[code]) return { reg:DATA[code], own:true, from:null };
  const parents = code.length === 7 ? [code.slice(0,5), code.slice(0,2)]
                : code.length === 5 ? [code.slice(0,2)]
                : [];
  for (const p of parents) {
    if (!DATA[p]) continue;
    // 시도에서 물려받을 때는 시도 점수가 아니라 '외곽 기준값'을 쓴다.
    // 시도 점수는 판교·천안 같은 상위 지역이 끌어올린 값이라 그대로 쓰면
    // 이천시가 서울 양천구와 동점이 되는 일이 생긴다. (SIDO_BASE 주석 참고)
    if (p.length === 2 && typeof SIDO_BASE !== "undefined" && SIDO_BASE[p])
      return { reg:SIDO_BASE[p], own:false, from:DATA[p].name };
    // 시군구 → 동도 같은 문제가 있어 일정 비율만큼 낮춘다. (SGG_DECAY 주석 참고)
    if (p.length === 5 && typeof SGG_DECAY !== "undefined")
      return { reg:decay(DATA[p], SGG_DECAY[p] || SGG_DECAY_DEFAULT),
               own:false, from:DATA[p].name };
    return { reg:DATA[p], own:false, from:DATA[p].name };
  }
  return { reg:null, own:false, from:null };
}
// 점수만 비율로 낮춘 사본. 이름·태그·뉴스는 그대로 둔다.
const DECAY_KEYS = ["score","transport","develop","policy","supply",
                    "job","school","life","population","future"];
function decay(reg, k) {
  const o = Object.assign({}, reg);
  for (const key of DECAY_KEYS)
    if (typeof o[key] === "number") o[key] = Math.round(o[key] * k);
  return o;
}

// "서울특별시 › 강남구" 형태의 상위 경로
function pathOf(code) {
  code = String(code);
  const out = [];
  if (code.length >= 5 && DATA[code.slice(0,2)]) out.push(DATA[code.slice(0,2)].name);
  if (code.length >= 7 && DATA[code.slice(0,5)]) out.push(DATA[code.slice(0,5)].name);
  return out.join(" › ");
}
// ── 실측 지표 ────────────────────────────────────────────────
// data-metrics.js 는 행정동 3,504개 전부에 대해 좌표로 계산된 값을 담습니다.
// 이 중 transport(역세권)만 손으로 매긴 점수를 대체합니다. school_access·
// life_density 는 이름이 뜻하는 것과 재는 것이 달라 참고 정보로만 씁니다.
const HAS_METRICS = typeof METRICS !== "undefined";
const HAS_PRICES  = typeof PRICES  !== "undefined";
const HAS_REDEV   = typeof REDEV   !== "undefined";

function metricsFor(code) {
  return (HAS_METRICS && code.length === 7) ? METRICS[code] : null;
}
// 정비사업 실데이터. 동에 없으면 상위 시군구 것을 쓰되 상속임을 표시한다.
function redevFor(code) {
  if (!HAS_REDEV) return null;
  if (REDEV[code]) return Object.assign({ own:true }, REDEV[code]);
  if (code.length === 7 && REDEV[code.slice(0,5)])
    return Object.assign({ own:false }, REDEV[code.slice(0,5)]);
  return null;
}

// GeoJSON feature에서 필요한 값만 뽑아 정규화
function info(f) {
  const p = f.properties;
  const code = String(p.code);
  const L = lookup(code);
  const mx = metricsFor(code);
  const rx = redevFor(code);
  // 역세권은 상속값이 아니라 그 동의 실제 계산값을 쓴다
  let view = L.reg ? (mx ? Object.assign({}, L.reg, { transport:mx.transport }) : L.reg) : null;
  const d0 = { code, name:p.name };
  const px = view ? priceFor(d0) : null;
  if (view) {
    const base = baseScore(view);
    const ps = px ? priceScore(px.py) : null;
    view = Object.assign({}, view, {
      price: ps,
      priceRaw: px,
      base: Math.round(base),
      score: Math.round(ps != null ? base * (1 - PRICE_W) + ps * PRICE_W : base),
    });
  }
  return { code, name:p.name, reg:L.reg, view, mx, rx, px, own:L.own, from:L.from, path:pathOf(code) };
}

// ── 지도 초기화 ─────────────────────────────────────────────
const map = L.map("map", { center:[36.2,127.9], zoom:7 });
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {

// ── 툴팁 ────────────────────────────────────────────────────
const htip = document.getElementById("htip");
const mapArea = document.getElementById("map-area");
function moveTip(clientX, clientY) {
  const r = mapArea.getBoundingClientRect();
  let x = clientX - r.left + 14, y = clientY - r.top - 10;
  if (x + 180 > mapArea.offsetWidth) x -= 194;
  htip.style.left = x + "px"; htip.style.top = y + "px";
}
mapArea.addEventListener("mousemove", e => {
  if (htip.style.display !== "block") return;
  moveTip(e.clientX, e.clientY);
});

function showTip(d, e) {
  document.getElementById("htip-name").textContent = d.name;
  document.getElementById("htip-path").textContent = d.path;
  if (d.view) {
    const sc = getScore(d.view);
    document.getElementById("htip-score").textContent = sc + "점";
    document.getElementById("htip-grade").textContent = scoreStyle(sc).grade;
    const notes = [];
    if (d.mx) notes.push(`역까지 ${d.mx.station_m}m`);
    if (!d.own) notes.push(`${d.from} 기준 참고값`);
    document.getElementById("htip-inh").textContent = notes.join(" · ");
  } else {
    document.getElementById("htip-score").textContent = "데이터 준비중";
    document.getElementById("htip-grade").textContent = "";
    document.getElementById("htip-inh").textContent = "";
  }
  htip.style.display = "block";
  moveTip(e.originalEvent.clientX, e.originalEvent.clientY);
}
function hideTip() { htip.style.display = "none"; }

// ── 실거래가 점수화 ──────────────────────────────────────────
// 가격은 편차가 커서 백분위로 바꾸면 안 된다. 전국 214곳 중 대부분이 지방이라
// 대구 서구(평당 1,600만)가 77번째로 올라간다 — 강남의 1/7 가격인데.
// 로그 척도로 1,000만/평=30점, 1.3억/평=100점에 맞춘다.
const PRICE_LO = Math.log(1000e4), PRICE_HI = Math.log(13000e4);
function priceScore(py) {
  return Math.max(20, Math.min(100,
    Math.round(30 + (Math.log(py) - PRICE_LO) / (PRICE_HI - PRICE_LO) * 70)));
}
// 종합점수 = 호재 0.72 + 가격 0.28.
// 가격을 아예 빼면 반도체 산단 하나로 농촌 지역이 마포·양천 위로 올라가고,
// 너무 많이 넣으면 "지금 싼데 뜨는 곳"을 못 찾아준다. 그 사이를 잡은 값이다.
const PRICE_W = 0.28;

// ── 실거래가 조회 ────────────────────────────────────────────
// 국토부 실거래가는 법정동 기준이고 지도는 행정동 기준이라 이름이 어긋난다.
//   행정동 신정4동  → 법정동 신정동      (숫자 떼기)
//   행정동 문래동    → 법정동 문래동1~6가 (여럿을 묶어 중앙값)
//   행정동 여의동    → 법정동 여의도동    (별칭)
// 못 이으면 시군구 값으로 떨어지고, 카드에 어느 쪽인지 밝힌다.
const DONG_ALIAS = { "여의동":"여의도동", "잠실본동":"잠실동", "가락본동":"가락동",
                     "반포본동":"반포동", "방배본동":"방배동", "일원본동":"일원동",
                     "중계본동":"중계동", "영등포본동":"영등포동" };

function fmtWon(w) {
  const eok = w / 100000000;
  if (eok >= 1) return `${eok.toFixed(eok >= 10 ? 0 : 1)}억`;
  return `${Math.round(w / 10000).toLocaleString()}만`;
}
const median = a => {
  const v = [...a].sort((x, y) => x - y);
  return v.length % 2 ? v[(v.length - 1) / 2] : (v[v.length/2 - 1] + v[v.length/2]) / 2;
};

function priceFor(d) {
  if (!HAS_PRICES) return null;
  const sgg = d.code.slice(0, 5);
  if (d.code.length === 7) {
    const raw = DONG_ALIAS[d.name] || d.name;
    const stem = raw.replace(/[0-9·]+동$/, "동").replace(/동$/, "");
    const hits = [];
    for (const key in PRICES) {
      if (!key.startsWith(sgg + "|")) continue;
      const bj = key.slice(sgg.length + 1);
      // "신정동"=="신정동", 또는 "문래동3가"가 "문래동"으로 시작
      if (bj === raw || bj === stem + "동" || bj.startsWith(stem + "동")) hits.push(PRICES[key]);
    }
    if (hits.length) {
      return { py:median(hits.map(h => h.py)), n:hits.reduce((a, h) => a + h.n, 0),
               scope:"동" };
    }
  }
  const s = typeof PRICES_SGG !== "undefined" ? PRICES_SGG[sgg] : null;
  if (!s) return null;
  return { py:s.py, n:s.n, rank:s.rank, scope:d.code.length === 5 ? "구" : "구 전체" };
}

// 실거래가는 추정이 아니라 실제 거래라 이야기에도 넣는다
function priceBeat(d) {
  const p = priceFor(d);
  if (!p) return null;
  const bits = [`최근 3개월 ${p.n.toLocaleString()}건 거래`];
  if (p.rank && typeof PRICE_META !== "undefined")
    bits.push(`전국 ${PRICE_META.total_sgg}곳 중 ${p.rank}위`);
  if (p.scope !== "동" && d.code.length === 7) bits.push("구 전체 기준");
  return { icon:"💰", head:`아파트 평당 ${fmtWon(p.py)} 선에 거래돼요`,
           detail:bits.join(" · "), kind:"plus", weight:0, key:"price",
           measured:true, pin:true };
}

    down:[[54,"장기 전망은 밝지 않은 편이에요"]],
  },
};

// 역세권은 점수가 아니라 실제 거리로 말한다
function walkBeat(mx) {
  if (!mx) return null;
  const m = mx.station_m, min = Math.max(1, Math.round(m / 67));   // 도보 67m/분
  let head, kind = "plus";
  if (m <= 300)       head = `지하철역이 코앞이에요 — 걸어서 ${min}분`;
  else if (m <= 700)  head = `역까지 걸어서 ${min}분이면 가요`;
  else if (m <= 1200) head = `역까지 걸어서 ${min}분쯤 걸려요`;
  else if (m <= 1800) { head = `역이 좀 멀어요 — 걸어서 ${min}분`; kind = "minus"; }
  else if (m <= 3000) { head = "역까지 걸어가긴 힘들어요 — 버스를 타야 해요"; kind = "minus"; }
  else                { head = "역이 멀어서 차가 거의 필수예요"; kind = "minus"; }
  const detail = mx.station_n >= 2
    ? `1km 안에 역이 ${mx.station_n}개나 있어서 환승도 편해요.`
    : null;
  return { icon:kind === "plus" ? "🚇" : "🚗", head, detail, kind,
           weight:mx.transport, key:"transport" };
}

function pick(tiers, v) {
  for (const [th, text] of tiers) if (v >= th) return text;
  return null;
}
function pickDown(tiers, v) {
  for (const [th, text] of tiers) if (v <= th) return text;
  return null;
}

// 정비사업은 추정이 아니라 공공데이터라 별도로 말한다
function redevBeat(rx) {
  if (!rx || !rx.n) return null;
  const u = rx.units ? `${rx.units.toLocaleString()}세대 규모` : null;
  const near = ["착공", "관리처분인가"].includes(rx.top);
  const head = near
    ? `재개발·재건축이 곧 시작돼요 — ${rx.n}곳 진행 중`
    : `재개발·재건축이 ${rx.n}곳 추진되고 있어요`;
  const bits = [];
  if (u) bits.push(u);
  if (rx.top) bits.push(`대부분 ${rx.top} 단계`);
  if (!rx.own) bits.push("구 전체 기준");
  return { icon:"🔨", head, detail:bits.join(" · ") || null, kind:"plus",
           weight:rx.redev + (near ? 6 : 0), key:"redev", measured:true };
}

// 지역 하나에서 이야기 뽑기 — 강점 최대 3개 + 약점 최대 2개
function buildStory(d) {
  const reg = d.view;
  const news = reg.news || [];
  const detailOf = k => {
    const n = news.find(x => x.t === k);
    return n ? n.tx : null;
  };

  const plus = [], minus = [];
  const w = walkBeat(d.mx);
  if (w) (w.kind === "plus" ? plus : minus).push(w);
  const rb = redevBeat(d.rx);
  if (rb) plus.push(rb);

  for (const [key, spec] of Object.entries(BEATS)) {
    const v = reg[key];
    if (v == null) continue;
    const up = pick(spec.up, v);
    if (up) { plus.push({ icon:spec.icon, head:up, detail:detailOf(key), kind:"plus", weight:v, key }); continue; }
    const dn = pickDown(spec.down, v);
    // 약점에는 뉴스를 붙이지 않는다. 유형만 맞으면 붙다 보니
    // "정비사업 기대 낮음" 밑에 "구역 지정" 같은 호재가 달려 앞뒤가 안 맞았다.
    if (dn) minus.push({ icon:"⚠️", head:dn, detail:null, kind:"minus", weight:100 - v, key });
  }

  plus.sort((a, b) => b.weight - a.weight);
  minus.sort((a, b) => b.weight - a.weight);
  const out = plus.slice(0, 3).concat(minus.slice(0, 2));
  // 실거래가는 순위 경쟁 없이 맨 아래 붙인다 — 사실이라 빠질 이유가 없다
  const pb = priceBeat(d);
  if (pb) out.push(pb);

  // 강점이 하나도 안 잡히면 남은 뉴스라도 보여준다
  if (!out.length && news.length) {
    return news.slice(0, 3).map(n => ({
      icon:(CAT_LABELS[n.t] || "📌").slice(0, 2), head:n.tx, detail:null, kind:"plus", key:n.t,
    }));
  }
  return out;
}

// ── 탐험 기록 ────────────────────────────────────────────────
// 눌러본 동네를 기억해 진행률·관심 지역에 쓴다.
const LS = { seen:"hojae.seen", fav:"hojae.fav" };
const readLS = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const writeLS = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

let seen = new Set(readLS(LS.seen, []));
let favs = readLS(LS.fav, []);

const saveSeen = () => writeLS(LS.seen, [...seen]);
const saveFavs = () => writeLS(LS.fav, favs);

// 코드로 이름 찾기 — 관심 목록 표시용
const NAME_BY_CODE = {};
function remember(feature) { NAME_BY_CODE[String(feature.properties.code)] = feature.properties.name; }

function isSeen(code) { return seen.has(String(code)); }
function markSeen(code) {
  code = String(code);
  if (seen.has(code)) return false;
  seen.add(code); saveSeen(); renderExplore();
  return true;                     // 처음 열어본 곳
}

function renderExplore() {
  document.getElementById("favs").innerHTML = favs.length
    ? `<div class="fav-hd">⭐ 관심 지역 ${favs.length}곳</div>` + favs.map(f =>
        `<div class="fav-item" data-go="${f.code}">
          <span>${f.name}</span><span><b>${f.score}</b> <span class="fav-x" data-del="${f.code}">×</span></span>
        </div>`).join("")
    : "";
}

function toggleFav(code, name, score) {
  const i = favs.findIndex(f => f.code === code);
  if (i >= 0) favs.splice(i, 1);
  else favs.push({ code, name, score });
  saveFavs(); renderExplore();
  return i < 0;
}
const isFav = code => favs.some(f => f.code === code);

// 관심 목록 클릭 → 그 지역으로 이동
document.getElementById("favs").addEventListener("click", e => {
  const del = e.target.closest("[data-del]");
  if (del) { e.stopPropagation(); toggleFav(del.dataset.del); return; }
  const go = e.target.closest("[data-go]");
  if (go) flyToCode(go.dataset.go);
});

// 코드로 그 지역 찾아 이동 + 카드 열기
function flyToCode(code) {
  code = String(code);
  for (const k of LEVELS) {
    const layer = layers[k];
    if (!layer) continue;
    let hit = null;
    layer.eachLayer(l => { if (String(l.feature.properties.code) === String(code)) hit = l; });
    if (hit) {
      map.fitBounds(hit.getBounds(), { maxZoom:code.length === 5 ? 11 : 13 });
      const d = info(hit.feature);
      markSeen(d.code); showDetail(d); refreshStyles();
      openSheet();
      return;
    }
  }
  // 레이어에서 못 찾으면 좌표로라도 이동한다 (동 경계 로딩 실패 등)
  const m = typeof METRICS !== "undefined" ? METRICS[code] : null;
  if (m) map.setView([m.lat, m.lng], 13);
}

// ── GeoJSON 레이어 빌더 ──────────────────────────────────────
function geoStyle(reg, weight, code) {
  if (!reg) return { fillColor:"#ccc", fillOpacity:0.15, color:"#bbb", weight };
  const st = scoreStyle(getScore(reg));
  return { fillColor:st.fill, fillOpacity:st.op, color:st.stroke, weight, opacity:0.9 };
}

function buildLayer(geojson, weight) {
  return L.geoJSON(geojson, {
    style: f => geoStyle(info(f).view, weight, String(f.properties.code)),
    onEachFeature: (f, layer) => {
      remember(f);
      const d = info(f);
      const op = () => d.view ? scoreStyle(getScore(d.view)).op : 0.15;
      layer.on({
        click: () => {
          const fresh = markSeen(d.code);
          showDetail(d, fresh);
          if (fresh) layer.setStyle(geoStyle(d.view, weight, d.code));
          openSheet();
        },
        mouseover: e  => { showTip(d, e); layer.setStyle({ weight:weight+2, fillOpacity:Math.min(op()+0.18, 0.94) }); layer.bringToFront(); },
        mouseout:  () => { hideTip(); layer.setStyle({ weight, fillOpacity:op() }); }
      });
    }
  });
}

// TopoJSON을 FeatureCollection으로 변환 (objects 키가 파일마다 달라 첫 키를 사용)
function toGeo(topo) {
  const key = Object.keys(topo.objects)[0];
  return topojson.feature(topo, topo.objects[key]);
}

// ── 3단계 레이어 전환 ────────────────────────────────────────
const LEVELS = ["sido", "sgg", "dong"];
const WEIGHT = { sido:1.5, sgg:1, dong:0.5 };
const TH_SGG = 9, TH_DONG = 12;   // 줌 임계값

const layers = { sido:null, sgg:null, dong:null };
let curLevel = null;
let dongLoading = false, dongFailed = false;

function levelForZoom(z) {
  if (z >= TH_DONG) return "dong";
  if (z >= TH_SGG)  return "sgg";
  return "sido";
}

function setLevel(lv) {
  if (curLevel === lv) return;
  LEVELS.forEach(k => { if (k !== lv && layers[k] && map.hasLayer(layers[k])) map.removeLayer(layers[k]); });
  if (layers[lv]) layers[lv].addTo(map);
  curLevel = lv;
  document.querySelectorAll(".lv").forEach(el => el.classList.toggle("on", el.dataset.lv === lv));
  document.getElementById("zoom-hint").style.opacity = lv === "dong" ? "0" : "1";
}

// 동 경계는 4MB라 처음 필요해질 때 한 번만 받습니다.
function ensureDong() {
  if (layers.dong || dongLoading || dongFailed) return Promise.resolve();
  dongLoading = true;
  const box = document.getElementById("dong-loading");
  box.style.display = "flex";
  return fetch("geo-dong.json")
    .then(r => { if (!r.ok) throw new Error("geo-dong.json 없음"); return r.json(); })
    .then(topo => { layers.dong = buildLayer(toGeo(topo), WEIGHT.dong); })
    .catch(() => { dongFailed = true; })
    .finally(() => { dongLoading = false; box.style.display = "none"; });
}

function updateLayers() {
  const want = levelForZoom(map.getZoom());
  if (want === "dong") {
    if (layers.dong) { setLevel("dong"); }
    else { setLevel("sgg"); ensureDong().then(() => { if (levelForZoom(map.getZoom()) === "dong" && layers.dong) { curLevel = null; setLevel("dong"); } }); }
    return;
  }
  setLevel(want);
}
map.on("zoomend", updateLayers);

// ── 필터 ────────────────────────────────────────────────────
function refreshStyles() {
  LEVELS.forEach(k => {
    if (layers[k]) layers[k].setStyle(f => geoStyle(info(f).view, WEIGHT[k], String(f.properties.code)));
  });
}
document.querySelectorAll(".chip").forEach(c => {
  c.addEventListener("click", () => {
    document.querySelectorAll(".chip").forEach(x => x.classList.remove("on"));
    c.classList.add("on"); curFilter = c.dataset.c; refreshStyles();
  });
});



// ── 검색 ─────────────────────────────────────────────────────
// 색인은 세 층 전부 담는다. 동 경계는 지연 로딩이라 레이어에서 이름을 못 얻어
// data-metrics.js 에 넣어둔 name을 쓴다.
const SEARCH_INDEX = (() => {
  const out = [];
  for (const code in DATA) {
    if (code.length > 5) continue;                 // 동은 아래에서 따로
    out.push({ code, name:DATA[code].name, lv:code.length === 2 ? "시도" : "시군구" });
  }
  if (typeof METRICS !== "undefined")
    for (const code in METRICS)
      if (METRICS[code].name) out.push({ code, name:METRICS[code].name, lv:"동" });
  return out;
})();

// 같은 이름이 여러 곳 있다 — "대치"에는 강남 대치동과 진안 대치면이 다 걸린다.
// 점수가 높은 쪽을 위로 올린다. 찾는 사람은 보통 알려진 동네를 찾는다.
function searchScore(code) {
  const L = lookup(code);
  return L.reg ? L.reg.score : 0;
}

function searchRegions(q) {
  q = q.trim().replace(/\s+/g, "");
  if (!q) return [];
  const exact = [], starts = [], has = [];
  for (const r of SEARCH_INDEX) {
    const i = r.name.indexOf(q);
    if (r.name === q) exact.push(r);
    else if (i === 0) starts.push(r);
    else if (i > 0) has.push(r);
  }
  const byScore = (a, b) => searchScore(b.code) - searchScore(a.code)
                         || a.name.length - b.name.length;
  return exact.sort(byScore)
    .concat(starts.sort(byScore))
    .concat(has.sort(byScore))
    .slice(0, 12);
}

const $q = document.getElementById("search");
const $res = document.getElementById("search-results");
const $x = document.getElementById("search-x");
let selIdx = -1, curHits = [];

function renderSearch() {
  const q = $q.value;
  $x.classList.toggle("on", !!q);
  if (!q.trim()) { $res.innerHTML = ""; curHits = []; selIdx = -1; return; }

  curHits = searchRegions(q);
  if (!curHits.length) {
    $res.innerHTML = `<div class="sr-none">찾는 동네가 없어요</div>`;
    return;
  }
  $res.innerHTML = curHits.map((r, i) => {
    const L = lookup(r.code);
    const sc = L.reg ? getScore(L.reg) : null;
    const st = sc != null ? scoreStyle(sc) : null;
    const path = pathOf(r.code);
    return `<div class="sr ${i === selIdx ? "sel" : ""}" data-code="${r.code}">
      <div><div class="sr-name">${r.name}</div>
        ${path ? `<div class="sr-path">${path}</div>` : ""}</div>
      <div style="display:flex;align-items:center;gap:6px">
        <span class="sr-lv">${r.lv}</span>
        ${st ? `<span class="sr-score" style="color:${st.fill}">${sc}</span>` : ""}
      </div>
    </div>`;
  }).join("");
}

function clearSearch() {
  $q.value = ""; $res.innerHTML = ""; curHits = []; selIdx = -1;
  $x.classList.remove("on");
}

$q.addEventListener("input", renderSearch);
$x.addEventListener("click", () => { clearSearch(); $q.focus(); });
$res.addEventListener("click", e => {
  const el = e.target.closest("[data-code]");
  if (!el) return;
  goTo(el.dataset.code);
});
$q.addEventListener("keydown", e => {
  if (e.key === "Escape") return clearSearch();
  if (!curHits.length) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    selIdx = (selIdx + (e.key === "ArrowDown" ? 1 : -1) + curHits.length) % curHits.length;
    renderSearch();
    $res.children[selIdx]?.scrollIntoView({ block:"nearest" });
  } else if (e.key === "Enter") {
    e.preventDefault();
    goTo(curHits[Math.max(selIdx, 0)].code);
  }
});

// 검색 결과로 이동. 동이면 경계를 먼저 받아야 한다.
function goTo(code) {
  clearSearch();
  $q.blur();
  const need = String(code).length === 7;
  (need && !layers.dong ? ensureDong() : Promise.resolve()).then(() => flyToCode(code));
}

// ── 사이드바 접기 (넓은 화면) ────────────────────────────────
document.getElementById("sb-toggle").addEventListener("click", () => {
  document.getElementById("app").classList.toggle("sb-hidden");
  setTimeout(() => map.invalidateSize({ pan:false }), 260);
});

// ── 모바일 바텀시트 ──────────────────────────────────────────
// 좁은 화면에서는 카드가 지도 아래에서 올라온다. 손잡이를 끌거나 누르면
// 펼쳐지고 접힌다. 넓은 화면에서는 그냥 사이드바라 아무 일도 하지 않는다.
const sheet = document.getElementById("sidebar");
const isMobile = () => window.matchMedia("(max-width:720px)").matches;

// 시트 높이가 바뀌면 Leaflet에 크기를 다시 재게 한다.
// 이걸 안 하면 지도가 예전 크기를 기억해 타일이 어긋난다.
function syncMap() {
  document.body.classList.toggle("sheet-open", sheet.classList.contains("open"));
  document.body.classList.toggle("sheet-closed", sheet.classList.contains("closed"));
  setTimeout(() => map.invalidateSize({ pan:false }), 300);
}
function openSheet()  { if (!isMobile()) return; sheet.classList.remove("closed"); sheet.classList.add("open"); syncMap(); }
function closeSheet() { if (!isMobile()) return; sheet.classList.remove("open"); sheet.classList.add("closed"); syncMap(); }
function shrinkSheet() { sheet.classList.remove("open", "closed"); syncMap(); }
function toggleSheet() { sheet.classList.contains("open") ? closeSheet() : openSheet(); }

const handle = document.getElementById("sheet-handle");
let dragY = null, dragH = 0;
handle.addEventListener("click", e => { if (dragY === null) toggleSheet(); });
handle.addEventListener("touchstart", e => {
  dragY = e.touches[0].clientY; dragH = sheet.offsetHeight;
  sheet.style.transition = "none";
}, { passive:true });
handle.addEventListener("touchmove", e => {
  if (dragY === null) return;
  const h = Math.max(88, Math.min(window.innerHeight * 0.88, dragH + (dragY - e.touches[0].clientY)));
  sheet.style.height = h + "px";
}, { passive:true });
handle.addEventListener("touchend", () => {
  if (dragY === null) return;
  const ratio = sheet.offsetHeight / window.innerHeight;
  sheet.style.transition = ""; sheet.style.height = "";
  sheet.classList.remove("open", "closed");
  if (ratio > 0.6) sheet.classList.add("open");
  else if (ratio < 0.25) sheet.classList.add("closed");
  dragY = null;
  syncMap();
});
window.addEventListener("resize", () => map.invalidateSize({ pan:false }));

renderExplore();

// ── 데이터 로드 ──────────────────────────────────────────────
function load(url) {
  return fetch(url).then(r => { if (!r.ok) throw new Error(url + " 없음"); return r.json(); });
}
Promise.all([load("geo-sido.json"), load("geo-sigungu.json")])
  .then(([sidoTopo, sggTopo]) => {
    document.getElementById("loading").style.display = "none";
    layers.sido = buildLayer(toGeo(sidoTopo), WEIGHT.sido);
    layers.sgg  = buildLayer(toGeo(sggTopo),  WEIGHT.sgg);
    updateLayers();
  })
  .catch(err => {
    document.getElementById("loading").style.display = "none";
    const b = document.getElementById("err");
    b.style.display = "block";
    b.innerHTML = `⚠️ 지도 경계 파일을 불러오지 못했습니다.<br>
      <code>geo-sido.json</code> · <code>geo-sigungu.json</code><br>
      <small>${err.message}</small><br>
      <small>HTML을 더블클릭하지 말고 <code>python3 -m http.server</code>로 열어주세요.</small>`;
  });
