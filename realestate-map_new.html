<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>호재맵 — 부동산 호재 지도</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root {
  --bg:#fff; --bg2:#f5f6f9; --bg3:#eef0f4;
  --border:rgba(0,0,0,0.07); --border2:rgba(0,0,0,0.12);
  --text:#111214; --text2:#5a5f6e; --text3:#9298a8;
  --radius:12px; --radius-sm:8px; --shadow:0 4px 24px rgba(0,0,0,0.11);
}
html,body { height:100%; font-family:'Noto Sans KR',sans-serif; overflow:hidden; }
#app { display:flex; height:100vh; }
#map-area { flex:1; position:relative; }
#map { width:100%; height:100%; }

/* 호버 툴팁 */
#htip {
  position:absolute; pointer-events:none; z-index:2000;
  background:rgba(10,11,15,0.88); color:white;
  border-radius:10px; padding:7px 12px;
  font-size:12px; font-weight:600; white-space:nowrap;
  display:none; line-height:1.6;
  box-shadow:0 4px 16px rgba(0,0,0,0.3);
}
#htip .tip-grade { font-size:10px; font-weight:500; opacity:0.75; margin-top:1px; }

#top-bar {
  position:absolute; top:16px; left:50%; transform:translateX(-50%);
  background:var(--bg); border-radius:24px; padding:9px 20px;
  box-shadow:var(--shadow); display:flex; align-items:center; gap:10px;
  z-index:1000; white-space:nowrap; pointer-events:none;
}
#top-bar .dot { width:8px; height:8px; border-radius:50%; background:#003fa5; }
#top-bar .logo { font-size:14px; font-weight:700; letter-spacing:-0.3px; }
#top-bar .sub  { font-size:11px; color:var(--text3); }

#zoom-badge {
  position:absolute; top:16px; left:16px;
  background:var(--bg); border-radius:20px; padding:6px 12px;
  box-shadow:var(--shadow); font-size:11px; font-weight:600;
  color:var(--text2); z-index:1000; display:flex; align-items:center; gap:6px;
}
.bdot { width:6px; height:6px; border-radius:50%; background:#003fa5; }

#zoom-hint {
  position:absolute; bottom:28px; left:50%; transform:translateX(-50%);
  background:rgba(15,16,20,0.70); color:white; border-radius:20px;
  padding:6px 14px; font-size:11px; z-index:1000; pointer-events:none;
  white-space:nowrap; transition:opacity 0.5s;
}
#loading {
  position:absolute; inset:0; background:#f5f6f9;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  z-index:2000; gap:14px;
}
.spinner { width:36px; height:36px; border:3px solid var(--bg3); border-top-color:#1565c0; border-radius:50%; animation:spin 0.8s linear infinite; }
#loading p { font-size:13px; color:var(--text3); }
@keyframes spin { to { transform:rotate(360deg); } }
#err {
  display:none; position:absolute; top:70px; left:50%; transform:translateX(-50%);
  background:#fff3cd; border:1px solid #ffc107; border-radius:var(--radius-sm);
  padding:10px 16px; font-size:12px; color:#856404; z-index:1000;
  max-width:420px; text-align:center; line-height:1.7;
}

/* 사이드바 */
#sidebar {
  width:292px; height:100vh; overflow-y:auto;
  background:var(--bg); border-left:1px solid var(--border);
  display:flex; flex-direction:column;
  box-shadow:-2px 0 14px rgba(0,0,0,0.07);
}
#sb-brand { padding:18px 18px 14px; border-bottom:1px solid var(--border); }
#sb-brand h1 { font-size:15px; font-weight:700; letter-spacing:-0.4px; }
#sb-brand p  { font-size:11px; color:var(--text3); margin-top:3px; }
#legend { padding:12px 18px; border-bottom:1px solid var(--border); }
.sec-label { font-size:10px; font-weight:600; color:var(--text3); text-transform:uppercase; letter-spacing:0.6px; margin-bottom:8px; }
.leg-steps { display:flex; gap:2px; margin-bottom:6px; border-radius:4px; overflow:hidden; }
.leg-step { flex:1; height:12px; }
.leg-lbls { display:flex; justify-content:space-between; font-size:9px; color:var(--text3); }
#filters { padding:11px 18px; border-bottom:1px solid var(--border); }
.chips { display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
.chip {
  padding:4px 10px; border-radius:20px; font-size:11px; font-weight:500;
  cursor:pointer; border:1px solid var(--border2); color:var(--text2);
  background:transparent; transition:all 0.15s; user-select:none;
}
.chip:hover { background:var(--bg3); }
.chip.on { background:#dce8f8; color:#1565c0; border-color:#90baea; }
#detail { flex:1; padding:14px 18px; }
.ph { text-align:center; color:var(--text3); font-size:12px; padding-top:55px; line-height:2.2; }
.ph-icon { font-size:28px; }
.r-name { font-size:16px; font-weight:700; letter-spacing:-0.4px; margin-bottom:3px; }
.r-sub  { font-size:11px; color:var(--text3); margin-bottom:13px; }
.score-card {
  display:flex; justify-content:space-between; align-items:center;
  border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:14px;
}
.sc-num  { font-size:28px; font-weight:700; letter-spacing:-1px; line-height:1; }
.sc-unit { font-size:13px; font-weight:400; }
.sc-lbl  { font-size:10px; margin-top:3px; opacity:0.6; }
.sc-grade { font-size:13px; font-weight:700; }
.cats { margin-bottom:14px; }
.cat-row { display:flex; justify-content:space-between; font-size:11px; color:var(--text2); margin-bottom:3px; }
.cat-val { font-weight:600; }
.bar-bg  { height:4px; border-radius:2px; background:var(--bg3); margin-bottom:8px; overflow:hidden; }
.bar-fill { height:100%; border-radius:2px; }
.news-hd { font-size:10px; font-weight:600; color:var(--text3); text-transform:uppercase; letter-spacing:0.6px; margin-bottom:9px; }
.news-item { padding:8px 0; border-bottom:1px solid var(--border); }
.news-item:last-child { border-bottom:none; }
.ntag { display:inline-block; font-size:10px; font-weight:700; padding:2px 6px; border-radius:4px; margin-bottom:3px; }
.t-transport { background:#dce8f8; color:#1565c0; }
.t-develop   { background:#e0f0d0; color:#2e6b0e; }
.t-policy    { background:#faecd6; color:#7a4800; }
.t-supply    { background:#fbe8e8; color:#9e2a2a; }
.t-job       { background:#f3e5f5; color:#6a1b9a; }
.t-school    { background:#e0f7fa; color:#00838f; }
.t-life      { background:#e8f5e9; color:#2e7d32; }
.t-population{ background:#fff3e0; color:#e65100; }
.t-future    { background:#e3eaf8; color:#003fa5; }
.ntext { font-size:12px; color:var(--text); line-height:1.55; }
.ndate { font-size:10px; color:var(--text3); margin-top:2px; }
.ai-btn {
  display:block; width:100%; margin-top:14px; padding:11px;
  background:var(--text); color:white; border:none; border-radius:var(--radius-sm);
  font-size:12px; font-weight:600; cursor:pointer; font-family:inherit;
  letter-spacing:-0.2px; transition:opacity 0.15s;
}
.ai-btn:hover { opacity:0.78; }
#sidebar::-webkit-scrollbar { width:3px; }
#sidebar::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }
.leaflet-container { font-family:'Noto Sans KR',sans-serif !important; }
</style>
</head>
<body>
<div id="app">
  <div id="map-area">
    <div id="map"></div>
    <div id="loading"><div class="spinner"></div><p>지도 데이터를 불러오는 중...</p></div>
    <div id="err"></div>
    <div id="htip"><span id="htip-name"></span><br><span id="htip-score"></span><div class="tip-grade" id="htip-grade"></div></div>
    <div id="top-bar"><div class="dot"></div><span class="logo">호재맵</span><span class="sub">전국 부동산 호재 지도</span></div>
    <div id="zoom-badge"><div class="bdot"></div><span id="zoom-label">시도 단위</span></div>
    <div id="zoom-hint">🔍 스크롤로 확대하면 시군구 단위로 전환됩니다</div>
  </div>
  <div id="sidebar">
    <div id="sb-brand"><h1>부동산 호재 지도</h1><p>지역을 클릭하면 상세 정보를 볼 수 있어요</p></div>
    <div id="legend">
      <div class="sec-label">호재 지수 (7단계)</div>
      <div class="leg-steps">
        <div class="leg-step" style="background:#6d0000"></div>
        <div class="leg-step" style="background:#c62828"></div>
        <div class="leg-step" style="background:#e65100"></div>
        <div class="leg-step" style="background:#f9a825"></div>
        <div class="leg-step" style="background:#2e7d32"></div>
        <div class="leg-step" style="background:#1565c0"></div>
        <div class="leg-step" style="background:#003fa5"></div>
      </div>
      <div class="leg-lbls"><span>~39</span><span>40</span><span>50</span><span>60</span><span>70</span><span>80</span><span>90+</span></div>
    </div>
    <div id="filters">
      <div class="sec-label">유형 필터</div>
      <div class="chips">
        <div class="chip on" data-c="all">전체</div>
        <div class="chip" data-c="transport">🚇 교통</div>
        <div class="chip" data-c="develop">🏗 개발</div>
        <div class="chip" data-c="policy">📋 정책</div>
        <div class="chip" data-c="supply">🏠 공급</div>
        <div class="chip" data-c="job">💼 직주근접</div>
        <div class="chip" data-c="school">🏫 학군</div>
        <div class="chip" data-c="life">🌱 라이프</div>
        <div class="chip" data-c="population">👥 인구</div>
        <div class="chip" data-c="future">🔮 미래가치</div>
      </div>
    </div>
    <div id="detail"><div class="ph"><div class="ph-icon">📍</div><br>지역을 클릭하면<br>호재 정보가 표시됩니다</div></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

// ── 7단계 색상 ───────────────────────────────────────────────
function scoreStyle(s) {
  if (s >= 90) return { fill:"#003fa5", stroke:"#002b80", op:0.78, cardBg:"#ccd9f5", cardText:"#003fa5", grade:"최상 호재" };
  if (s >= 80) return { fill:"#1565c0", stroke:"#0d47a1", op:0.70, cardBg:"#dce8f8", cardText:"#1565c0", grade:"강한 호재" };
  if (s >= 70) return { fill:"#2e7d32", stroke:"#1b5e20", op:0.65, cardBg:"#e0f0d0", cardText:"#2e6b0e", grade:"긍정" };
  if (s >= 60) return { fill:"#f9a825", stroke:"#c17900", op:0.62, cardBg:"#fff8e1", cardText:"#7a4800", grade:"약한 긍정" };
  if (s >= 50) return { fill:"#e65100", stroke:"#bf360c", op:0.60, cardBg:"#faecd6", cardText:"#7a4800", grade:"중립" };
  if (s >= 40) return { fill:"#c62828", stroke:"#8e0000", op:0.68, cardBg:"#fbe8e8", cardText:"#9e2a2a", grade:"위험" };
  return               { fill:"#6d0000", stroke:"#3e0000", op:0.75, cardBg:"#f5d0d0", cardText:"#6b0000", grade:"심각" };
}

  transport:"🚇 교통", develop:"🏗 개발", policy:"📋 정책", supply:"🏠 공급",
  job:"💼 직주근접", school:"🏫 학군파워", life:"🌱 라이프", population:"👥 인구모멘텀", future:"🔮 미래가치"
};
const CAT_COLORS = {
  transport:"#1565c0", develop:"#2e6b0e", policy:"#7a4800", supply:"#9e2a2a",
  job:"#6a1b9a", school:"#00838f", life:"#388e3c", population:"#e65100", future:"#003fa5"
};
const CAT_DESC = {
  transport:"GTX·지하철·버스 등 교통 인프라",
  develop:"재개발·재건축·신도시 개발 사업",
  policy:"규제완화·정비사업 정책 수혜",
  supply:"입주물량·전세가 수급 상황",
  job:"삼성·하이닉스·판교·여의도 등 대형 고용지 접근성",
  school:"대치·목동·분당 학원가·명문교 밀집도",
  life:"한강·공원·헬스·카페 라이프 인프라 밀도",
  population:"MZ세대 유입·인구 순증·외국인 투자 트렌드",
  future:"AI·반도체·바이오 산업 수혜, 재건축 연한, 미래 용적률"
};
let curFilter = "all";
const ALL_CATS = ["transport","develop","policy","supply","job","school","life","population","future"];

function getScore(reg) { return curFilter==="all" ? reg.score : (reg[curFilter]||reg.score); }

// ── Feature → 데이터 매핑 ────────────────────────────────────
function getSidoReg(f) {
  const n1 = f.properties.NAME_1;
  if (SIDO[n1]) return SIDO[n1];
  if (SIDO_FB[n1] && SIDO[SIDO_FB[n1]]) return SIDO[SIDO_FB[n1]];
  return null;
}
function getSigunguReg(f) {
  const n1 = f.properties.NAME_1, n2 = f.properties.NAME_2;
  const key = `${n1}|${n2}`;
  if (SIGUNGU[key]) return SIGUNGU[key];
  // 폴백: 시도 데이터 상속
  return getSidoReg(f);
}

// ── 지도 초기화 ─────────────────────────────────────────────
const map = L.map("map", { center:[36.2,127.9], zoom:7 });
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
  attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/">CARTO</a>',
  subdomains:"abcd", maxZoom:19,
}).addTo(map);

// ── 툴팁 ────────────────────────────────────────────────────
const htip = document.getElementById("htip");
const mapArea = document.getElementById("map-area");
mapArea.addEventListener("mousemove", e => {
  if (htip.style.display === "none") return;
  let x = e.clientX - mapArea.getBoundingClientRect().left + 14;
  let y = e.clientY - mapArea.getBoundingClientRect().top - 10;
  if (x + 160 > mapArea.offsetWidth) x -= 170;
  htip.style.left = x+"px"; htip.style.top = y+"px";
});

function showTip(reg, e) {
  const sc = getScore(reg);
  const st = scoreStyle(sc);
  document.getElementById("htip-name").textContent = reg.name;
  document.getElementById("htip-score").textContent = sc+"점";
  document.getElementById("htip-grade").textContent = st.grade;
  htip.style.display = "block";
  let x = e.originalEvent.clientX - mapArea.getBoundingClientRect().left + 14;
  let y = e.originalEvent.clientY - mapArea.getBoundingClientRect().top - 10;
  htip.style.left = x+"px"; htip.style.top = y+"px";
}
function hideTip() { htip.style.display = "none"; }

// ── 사이드바 상세 ────────────────────────────────────────────
function showDetail(reg) {
  const sc = getScore(reg);
  const st = scoreStyle(sc);

  // 테마 태그
  const tagsHTML = (reg.tags||[]).map(t =>
    `<span style="display:inline-block;background:rgba(0,0,0,0.07);border-radius:20px;padding:3px 9px;font-size:10px;font-weight:600;margin:2px 2px 2px 0;color:var(--text2)">${t}</span>`
  ).join("");

  // 9개 지표 바
  const CATS1 = ["transport","develop","policy","supply"];
  const CATS2 = ["job","school","life","population","future"];
  function barRow(c) {
    const v = reg[c]||50;
    return `<div class="cat-row" title="${CAT_DESC[c]}">
      <span style="font-size:11px;color:var(--text2)">${CAT_LABELS[c]}</span>
      <span class="cat-val" style="color:${CAT_COLORS[c]};font-size:11px;font-weight:600">${v}점</span>
    </div>
    <div class="bar-bg"><div class="bar-fill" style="width:${v}%;background:${CAT_COLORS[c]}"></div></div>`;
  }

  // 뉴스
  const news = curFilter==="all" ? reg.news : reg.news.filter(n=>n.t===curFilter);
  const newsHTML = (news.length?news:reg.news).map(n=>`
    <div class="news-item"><span class="ntag t-${n.t}">${CAT_LABELS[n.t]}</span>
    <div class="ntext">${n.tx}</div><div class="ndate">${n.d}</div></div>`).join("");

  document.getElementById("detail").innerHTML = `
    <div class="r-name">${reg.name}</div>
    <div class="r-sub">호재지수 ${sc}점</div>
    <div class="score-card" style="background:${st.cardBg}">
      <div><div class="sc-num" style="color:${st.fill}">${sc}<span class="sc-unit">점</span></div>
      <div class="sc-lbl" style="color:${st.cardText}">종합 호재지수</div></div>
      <div class="sc-grade" style="color:${st.fill}">${st.grade}</div>
    </div>
    ${tagsHTML ? `<div style="margin-bottom:12px;line-height:1.8">${tagsHTML}</div>` : ""}
    <div style="font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:8px">기본 지표</div>
    <div class="cats">${CATS1.map(barRow).join("")}</div>
    <div style="font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:8px;margin-top:4px">정성 지표</div>
    <div class="cats">${CATS2.map(barRow).join("")}</div>
    <div class="news-hd">주요 호재 / 악재</div>${newsHTML}
    <button class="ai-btn">🔍 ${reg.name} AI 심층 분석 →</button>`;
}

// ── GeoJSON 레이어 빌더 ──────────────────────────────────────
function geoStyle(reg, weight) {
  if (!reg) return { fillColor:"#ccc", fillOpacity:0.15, color:"#bbb", weight };
  const st = scoreStyle(getScore(reg));
  return { fillColor:st.fill, fillOpacity:st.op, color:st.stroke, weight, opacity:0.9 };
}

function buildLayer(geojson, getRegFn, weight) {
  return L.geoJSON(geojson, {
    style: f => geoStyle(getRegFn(f), weight),
    onEachFeature: (f, layer) => {
      const reg = getRegFn(f);
      if (!reg) return;
      const st = () => scoreStyle(getScore(reg));
      layer.on({
        click:     () => showDetail(reg),
        mouseover: e  => { showTip(reg,e); layer.setStyle({ weight:weight+2, fillOpacity:Math.min(st().op+0.18,0.94) }); layer.bringToFront(); },
        mouseout:  () => { hideTip(); layer.setStyle({ weight, fillOpacity:st().op }); }
      });
    }
  });
}

// ── 레이어 전환 ──────────────────────────────────────────────
let sidoLayer=null, sigunguLayer=null, curLevel="sido";
const ZOOM_TH = 9;

function showSido() {
  if (sigunguLayer) map.removeLayer(sigunguLayer);
  if (sidoLayer)    sidoLayer.addTo(map);
  curLevel = "sido";
  document.getElementById("zoom-label").textContent = "시도 단위";
  document.getElementById("zoom-hint").style.opacity = "1";
}
function showSigungu() {
  if (sidoLayer)    map.removeLayer(sidoLayer);
  if (sigunguLayer) sigunguLayer.addTo(map);
  curLevel = "sigungu";
  document.getElementById("zoom-label").textContent = "시군구 단위";
  document.getElementById("zoom-hint").style.opacity = "0";
}
function updateLayers() {
  const z = map.getZoom();
  if (z >= ZOOM_TH && curLevel !== "sigungu" && sigunguLayer) showSigungu();
  else if (z < ZOOM_TH && curLevel !== "sido" && sidoLayer)   showSido();
}
map.on("zoomend", updateLayers);

// ── 필터 ────────────────────────────────────────────────────
function refreshStyles() {
  if (sidoLayer)    sidoLayer.setStyle(f => geoStyle(getSidoReg(f), 1.5));
  if (sigunguLayer) sigunguLayer.setStyle(f => geoStyle(getSigunguReg(f), 1));
}
document.querySelectorAll(".chip").forEach(c => {
  c.addEventListener("click", () => {
    document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));
    c.classList.add("on"); curFilter = c.dataset.c; refreshStyles();
  });
});

// ── 데이터 로드 ──────────────────────────────────────────────
Promise.all([
  fetch("skorea-provinces-geo.json").then(r=>{ if(!r.ok) throw new Error("skorea-provinces-geo.json 없음"); return r.json(); }),
  fetch("skorea-municipalities-geo.json").then(r=>{ if(!r.ok) throw new Error("skorea-municipalities-geo.json 없음"); return r.json(); }),
])
.then(([sidoGeo, sigunguGeo]) => {
  document.getElementById("loading").style.display = "none";
  sidoLayer    = buildLayer(sidoGeo,    getSidoReg,    1.5);
  sigunguLayer = buildLayer(sigunguGeo, getSigunguReg, 1);
  map.getZoom() >= ZOOM_TH ? showSigungu() : showSido();
})
.catch(err => {
  document.getElementById("loading").style.display = "none";
  const b = document.getElementById("err");
  b.style.display = "block";
  b.innerHTML = `⚠️ GeoJSON 파일을 찾을 수 없어요.<br>
    <code>skorea-provinces-geo.json</code> · <code>skorea-municipalities-geo.json</code><br>
    <small>${err.message}</small>`;
});
</script>
</body>
